name: CI

on:
  push:
    branches: [main, api-rewrite]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run check
      - run: bun run lint
      - run: bun run format:check
      - run: docker compose up -d --wait db quickwit
      - run: bun --filter api test
      - run: bun --filter web build
      - run: bun --filter api build
      # The aio stage extends the production image, so this builds both.
      - run: docker build --target aio -t rootprint-aio .
      - name: Smoke-test the all-in-one image
        run: |
          docker run -d --name aio -p 8282:8282 rootprint-aio
          for _ in $(seq 90); do
            curl -fsS http://localhost:8282/api/health && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' aio)" = true ] || break
            sleep 2
          done
          docker logs --tail 200 aio
          exit 1
