name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The aio stage runs apt-get on the target platform, so its arm64 build needs emulation.
      - uses: docker/setup-qemu-action@v4
        if: startsWith(github.ref, 'refs/tags/v')

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      # Bakes the star count into the web bundle so self-hosted instances never call
      # GitHub. Never fails the build: no count just hides the number in the sidebar.
      - name: Fetch GitHub star count
        id: stars
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "count=$(gh api "repos/$GITHUB_REPOSITORY" --jq .stargazers_count)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VITE_GITHUB_STARS=${{ steps.stars.outputs.count }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/metadata-action@v6
        id: meta-aio
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          images: ghcr.io/${{ github.repository }}-aio
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          context: .
          target: aio
          build-args: VITE_GITHUB_STARS=${{ steps.stars.outputs.count }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-aio.outputs.tags }}
          labels: ${{ steps.meta-aio.outputs.labels }}
          # Own scope, or every edge push evicts the arm64 apt-get layer and releases redo it under QEMU.
          cache-from: type=gha,scope=aio
          cache-to: type=gha,mode=max,scope=aio

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          echo "📋 [Full changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)" >> notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          generate_release_notes: true
